version: '3.8'

services:
  ads-emotion-api:
    build:
      context: ../..
      dockerfile: experiments/experiment_6/Dockerfile
    image: ads-emotion-api:latest
    container_name: ads-emotion-microservice
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
